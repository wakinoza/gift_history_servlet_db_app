# ===================================================================
# 1. アプリケーション基本設定
# ===================================================================

spring.application.name=gift-management-app-test

## ===================================================================
## 2. データベース接続設定 (外部TomcatのJNDIリソースを参照)
## ===================================================================
#
## テスト時はJNDI名を明示的に「空」にして無効化する
#spring.datasource.jndi-name=
#spring.datasource.url=jdbc:mysql://localhost:3307/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Tokyo
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
#spring.datasource.username=${DB_USER_NAME}
#spring.datasource.password=${DB_PASSWORD}


# ===================================================================
# 2. データベース接続設定 (テスト時はH2インメモリDBを使用)
# ===================================================================
# テスト時はJNDI名を明示的に「空」にして無効化する
spring.datasource.jndi-name=

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# 3. JPA / Hibernate 設定
# ===================================================================
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===================================================================
# 4. セッション / クッキー安全設定（Servlet時代のSet-Cookie手動書き換えの自動化）
# ===================================================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# ===================================================================
# 5. セキュリティヘッダー設定（Servlet時代のSecurityHeaderFilterの自動化）
# ===================================================================
spring.mvc.contentnegotiation.media-types.html=text/html;charset=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true


# ===================================================================
# 6. テスト環境用のJNDI自動設定無効化
# ===================================================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration