# ===================================================================
# 1. アプリケーション基本設定
# ===================================================================

spring.application.name=gift-management-app

# ===================================================================
# 2. データベース接続設定 (MySQL)
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:gift_db}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER_NAME:gift_user}
spring.datasource.password=${DB_PASSWORD:gift_user_password}

# ===================================================================
# 3. JPA / Hibernate 設定
# ===================================================================
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===================================================================
# 4. セッション / クッキー安全設定（Servlet時代のSet-Cookie手動書き換えの自動化）
# ===================================================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# ===================================================================
# 5. セキュリティヘッダー設定（Servlet時代のSecurityHeaderFilterの自動化）

spring.mvc.contentnegotiation.media-types.html=text/html;charset=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true