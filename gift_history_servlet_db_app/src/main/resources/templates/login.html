<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('ログイン - 頂き物管理アプリ')}"></head>
<body class="bg-light">

    <nav th:replace="~{common/layout :: navbar}">
	</nav> 

    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">

                    <div class="card-header bg-primary text-white text-center py-3">
                        <h1 class="h4 mb-0">頂き物管理ページ</h1>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-center text-muted mb-4">ようこそ。ログインしてください。</p>
						
						<p th:if="${param.error}" class="alert alert-danger">
                            ユーザー名またはパスワードが正しくありません
                        </p>
                        
                        <p th:if="${param.logout}" class="alert alert-success">
                            ログアウトしました
                        </p>
						
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label font-weight-bold">ユーザー名</label>
                                <input type="text" name="username" class="form-control form-control-lg" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label font-weight-bold">パスワード</label>
                                <input type="password" name="password" class="form-control form-control-lg" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm mt-3">ログイン</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{common/layout :: footer}"></div>
</body>
</html>
